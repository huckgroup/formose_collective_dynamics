#This dictionary defines parameters that cannot be changed during an experiment
experiment_name = "FAD011"
time_unit = "second"
reactor_volume = "294.7 ul"
concentration_unit = "mM"
solvent = "water"           #automatically adjust this syringe to match RT
step_size = "1 second"

solvent_split = { "water_1" = 1, "water_2" = 1 }
[syringe_concentrations]
DHA = 300
NaOH = 180
CaCl2 = 90
formaldehyde = 600

[standard_parameters]
#parameters that can be modified but are generally static
residence_time = 120 #in time_unit

[standard_parameters.syringe_parameters]
#The concentration of the reagent inside of the reactor_concentrations
#this value will be used as the base value to modulate from in dynamic flows
DHA = { reactor_concentration = 50, type = "steady_state" }
NaOH = { reactor_concentration = 30, type = "steady_state" }
CaCl2 = { reactor_concentration = 15, type = "steady_state" }
formaldehyde = { reactor_concentration = 100, type = "steady_state" }

